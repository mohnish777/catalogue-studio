services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PRODUCT_SOURCE: ${PRODUCT_SOURCE:-demo}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SALES_EMAIL: sales@catalogue.test
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
