services:
  backend:
    build: ./backend
    environment:
      PRODUCT_SOURCE: ${PRODUCT_SOURCE-live}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: catalogue@catalogue-studio.test
      SALES_EMAIL: sales@catalogue-studio.test
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
